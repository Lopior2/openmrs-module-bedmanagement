name: Semgrep SAST

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # upload-sarif lee el run (GET /actions/runs/{id}); sin esto, en un repo privado: «Resource not accessible by integration».
  actions: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      # semgrep/semgrep:1.165.0 — pinned by digest; bump manually when needed
      image: semgrep/semgrep@sha256:bd2ada83c7aa5a60e07d86ee84ba0c12282264781c8d783be5a912549a94394f
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - run: semgrep scan --config auto --sarif --output semgrep.sarif
        continue-on-error: true
      # Lopior2 está en el plan Free: en un repo privado no hay code scanning («Advanced Security must be enabled»).
      # La subida no bloquea; el SARIF queda como artefacto del run para revisarlo.
      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3.36.2
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
